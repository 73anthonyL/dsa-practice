name: Promote solutions

# Moves solutions marked "done" in workspace/ into solutions/, adds their
# README rows, and commits the result back to main.
on:
  push:
    branches: [main]
    paths: ["workspace/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    # It pushes to main, so never run it from another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - name: Promote finished solutions
        id: promote
        # Push whatever was promoted even if some files failed; the last step
        # fails the job so the errors still show up.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          python scripts/promote.py --commit
      - name: Catch up with main
        run: git pull --rebase origin main
      # Pushes made by this workflow don't trigger CI, so check exactly what
      # is about to be pushed.
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Push
        run: git push origin HEAD:main
      - name: Report files that couldn't be promoted
        if: steps.promote.outcome == 'failure'
        run: |
          echo "::error::Some workspace files couldn't be promoted; see the 'Promote finished solutions' step."
          exit 1
