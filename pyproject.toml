[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
# Solutions are kept exactly as submitted to LeetCode, so they aren't linted
# or reformatted, in workspace/ or once promoted to solutions/.
extend-exclude = ["solutions", "workspace"]

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
